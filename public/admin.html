<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Bookings — Nameleas Events</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a href="index.html" class="brand">Nameleas<span>Events</span></a>
      <span>Team dashboard</span>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <form id="login" class="card form" style="max-width:380px">
        <h2>Team login</h2>
        <label>Password
          <input name="password" type="password" required autocomplete="current-password">
        </label>
        <p class="form-error" role="alert" hidden></p>
        <button class="btn btn-block">View bookings</button>
      </form>

      <section id="dashboard" hidden>
        <h2>Bookings</h2>
        <p class="lead" id="summary"></p>
        <div class="card table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Ref</th><th>Client</th><th>Event</th><th>Location</th><th>Date</th>
                <th>Guests</th><th>Package</th><th>Notes</th><th>Status</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script>
    const STATUSES = ['pending', 'confirmed', 'completed', 'cancelled'];
    let password = '';

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    })[c]);

    async function api(path, options = {}) {
      const res = await fetch(path, {
        ...options,
        headers: { 'Content-Type': 'application/json', 'X-Admin-Password': password },
      });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || 'Request failed');
      return body;
    }

    function render(bookings) {
      bookings.sort((a, b) => a.date.localeCompare(b.date));
      const counts = STATUSES.map((s) => `${bookings.filter((b) => b.status === s).length} ${s}`);
      document.getElementById('summary').textContent = `${bookings.length} total · ${counts.join(' · ')}`;
      document.getElementById('rows').innerHTML = bookings.length ? bookings.map((b) => `
        <tr>
          <td><strong>${esc(b.id)}</strong></td>
          <td>${esc(b.name)}<br><a href="mailto:${esc(b.email)}">${esc(b.email)}</a><br>${esc(b.phone)}</td>
          <td>${esc(b.eventType)}</td>
          <td>${esc(b.location)}<br><small>${esc(b.venue)}</small></td>
          <td>${esc(b.date)}</td>
          <td>${esc(b.guests)}</td>
          <td>${esc(b.package)}</td>
          <td>${esc(b.notes)}</td>
          <td>
            <select class="status" data-id="${esc(b.id)}">
              ${STATUSES.map((s) => `<option ${s === b.status ? 'selected' : ''}>${s}</option>`).join('')}
            </select>
          </td>
        </tr>`).join('') : '<tr><td colspan="9">No bookings yet.</td></tr>';
    }

    async function load() {
      const { bookings } = await api('/api/bookings');
      render(bookings);
    }

    const login = document.getElementById('login');
    login.addEventListener('submit', async (e) => {
      e.preventDefault();
      password = login.password.value;
      const err = login.querySelector('.form-error');
      try {
        await load();
        login.hidden = true;
        document.getElementById('dashboard').hidden = false;
      } catch (error) {
        err.textContent = error.message === 'Failed to fetch'
          ? 'Server not running. Start it with: node server.js'
          : error.message;
        err.hidden = false;
      }
    });

    document.getElementById('rows').addEventListener('change', async (e) => {
      if (!e.target.matches('.status')) return;
      await api(`/api/bookings/${e.target.dataset.id}`, {
        method: 'PATCH',
        body: JSON.stringify({ status: e.target.value }),
      });
      load();
    });
  </script>
</body>
</html>
